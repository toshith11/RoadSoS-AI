name: roadsos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🌍 Location tracking (GPS)
  geolocator: ^14.0.2

  # 🔐 Permissions (camera, mic, location)
  permission_handler: ^12.0.1

  # 📸 Camera (photo + video)
  camera: ^0.11.2+1

  # 🖼️ Optional image picker (you can keep or remove later)
  image_picker: ^1.2.1

  # 🎤 Audio/video recording helper (optional but ok for your module)
  flutter_sound: ^9.30.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true